server:
  port: ${SERVER_PORT}

spring:
  application:
    name: OrderFlow-Pedido
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

orderflow:
  integracao:
    cliente-url: ${CLIENTE_URL}
    estoque-url: ${ESTOQUE_URL}
    produto-url: ${PRODUTO_URL}

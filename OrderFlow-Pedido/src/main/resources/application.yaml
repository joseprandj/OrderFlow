server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: OrderFlow-Pedido
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

orderflow:
  integracao:
    cliente-url: ${CLIENTE_URL:http://localhost:8081}
    estoque-url: ${ESTOQUE_URL:http://localhost:8082}
    produto-url: ${PRODUTO_URL:http://localhost:8086}
